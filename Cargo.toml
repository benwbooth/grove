[package]
name = "grove"
version = "0.1.0"
edition = "2021"
description = "A Finder-style file manager with Dolphin's power, for Linux (Rust + Qt Quick)"
license = "MIT"
repository = "https://github.com/benwbooth/grove"

[[bin]]
name = "grove"
path = "src/main.rs"

[workspace]
members = [".", "core"]
resolver = "2"

[dependencies]
grove-core = { path = "core" }
anyhow = "1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
# tessh coloured by its own grammar, as Tessera colours it (one to keep up).
tree-sitter-tessh = { git = "https://github.com/benwbooth/tessera", rev = "dd267e6f59cac2b4dc6f09d93312b2e82f08d659" }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy", "parsing", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
futures-channel = "0.3"
percent-encoding = "2"
alacritty_terminal = "0.25"
ureq = { version = "3", features = ["json"] }
socket2 = { version = "0.6", features = ["all"] }
rand = "0.9"
imagesize = "0.13"
calamine = "0.38"
rusqlite = { version = "0.43", features = ["bundled"] }
memchr = "2"
sha2 = "0.10"
git2 = { version = "0.21", features = ["ssh", "https"] }
similar = "3.2.1"
mdns-sd = "0.22.0"

[build-dependencies]
cxx-qt-build = "0.10"

# One optimized, incremental profile for everything (as Tessera/Almanac).
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
