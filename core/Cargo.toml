[package]
name = "grove-core"
version = "0.1.0"
edition = "2021"
description = "grove's file manager core: listing, file operations, trash, tags, search, thumbnails (no Qt)"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xattr = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
percent-encoding = "2"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
quick-xml = "0.37"
parking_lot = "0.12"
msi = "0.11.1"
cab = "0.6.0"
dmgwiz = "1.1.1"
hfsplus = "0.4.0"
apfs = "0.4.1"
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
encoding_rs = "0.8.44"
chardetng = "1.0.0"
cfb = "0.16"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
